image:
  repository: localhost:32000/grafan-lxd-monitoring
  tag: "latest"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

lxd:
  address: "https://10.0.0.250:8443"

existingSecretName: "openbao-creds"

metrics:
  serviceMonitor:
    enabled: true

grafana:
  dashboard:
    enabled: true