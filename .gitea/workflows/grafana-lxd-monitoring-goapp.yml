name: grafana-lxd-monitoring-go-app

# ------------------------------------------------------------------
# Switch to pull_request: trigger once you've validated this works:
#
# on:
#   pull_request:
#     branches: [ main ]
# ------------------------------------------------------------------
on:
  workflow_dispatch:

env:
  # MicroK8s server IP (update in Gitea org secrets when changing)
  IMAGE_REPO: harbor.local/microk8s/grafan-lxd-monitoring
  IMAGE_TAG: pr-${{ github.run_number }}
  RELEASENAME: grafan-lxd-monitoring-goapp
  HELM_CHART_DIR: ./helm-chart
  NAMESPACE: grafana-monitoring
  


jobs:
  # ----------------------------------------------------------------
  # Job 1: Build & push the Docker image (no approval needed)
  # ----------------------------------------------------------------
  build-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Harbor via OpenBao credentials for docekr push
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
        run: |
          # Authenticate with AppRole
          VAULT_TOKEN=$(curl -s -k -X POST "${VAULT_ADDR}/v1/auth/approle/login" \
            -H "Content-Type: application/json" \
            -d "{\"role_id\":\"${VAULT_ROLE_ID}\",\"secret_id\":\"${VAULT_SECRET_ID}\"}" \
            | jq -r '.auth.client_token')

          if [ -z "$VAULT_TOKEN" ] || [ "$VAULT_TOKEN" = "null" ]; then
            echo "ERROR: OpenBao login failed"
            exit 1
          fi

              [ -n "$VAULT_TOKEN" ] && [ "$VAULT_TOKEN" != "null" ]

          # Retrieve Harbor credentials
          HARBOR_SECRET=$(curl -fsSk \
            -H "X-Vault-Token: ${VAULT_TOKEN}" \
            "${VAULT_ADDR}/v1/homelab/data/harbor")

          HARBOR_USERNAME=$(echo "$HARBOR_SECRET" | jq -r '.data.data.username')
          HARBOR_PASSWORD=$(echo "$HARBOR_SECRET" | jq -r '.data.data.password')

          [ -n "$HARBOR_USERNAME" ] && [ "$HARBOR_USERNAME" != "null" ]
          [ -n "$HARBOR_PASSWORD" ] && [ "$HARBOR_PASSWORD" != "null" ]

          # Mask credentials in workflow logs
          echo "::add-mask::$HARBOR_USERNAME"
          echo "::add-mask::$HARBOR_PASSWORD"

          # Authenticate Docker
          printf '%s' "$HARBOR_PASSWORD" | docker login harbor.local \
            --username "$HARBOR_USERNAME" \
            --password-stdin

          echo "Successfully authenticated with Harbor"

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }} \
            ./app

      - name: Push to local registry
        run: |
          docker push ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}

      - name: Summary
        run: echo "Built and pushed ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }} successfully"

  # ----------------------------------------------------------------
  # Job 2: Deploy to grafan-lxd-monitoring-goapp  
  # ----------------------------------------------------------------
  deploy-grafana-lxd-monitoring-goapp:
    needs: build-pr
    runs-on: ubuntu-latest
    # environment: dev           # ← Gitea environment gate (add reviewers in repo settings)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.16.4'
      
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Fetch MicroK8s kubeconfig from OpenBao
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
        run: |
          # Authenticate with AppRole
          VAULT_TOKEN=$(curl -s -k -X POST "${VAULT_ADDR}/v1/auth/approle/login" \
            -H "Content-Type: application/json" \
            -d "{\"role_id\":\"${VAULT_ROLE_ID}\",\"secret_id\":\"${VAULT_SECRET_ID}\"}" \
            | jq -r '.auth.client_token')

          if [ -z "$VAULT_TOKEN" ] || [ "$VAULT_TOKEN" = "null" ]; then
            echo "ERROR: OpenBao login failed"
            exit 1
          fi

          # Fetch kubeconfig
          curl -s -k \
            -H "X-Vault-Token: ${VAULT_TOKEN}" \
            "${VAULT_ADDR}/v1/homelab/data/microk8s" \
            | jq -r '.data.data.kubeconfig' > /tmp/kubeconfig

          if [ ! -s /tmp/kubeconfig ]; then
            echo "ERROR: kubeconfig fetch failed or empty"
            exit 1
          fi
          echo "Kubeconfig fetched successfully"

      - name: Deploy ${{ env.RELEASENAME }} to namespace ${{ env.NAMESPACE }}
        run: |
          export KUBECONFIG=/tmp/kubeconfig

          helm upgrade --install ${{ env.RELEASENAME }} ${{ env.HELM_CHART_DIR }} \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set image.repository=${{ env.IMAGE_REPO }} \
            --set image.tag=${{ env.IMAGE_TAG }} \
            --wait --timeout 2m

      - name: Verify rollout
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          kubectl rollout restart deployment/${{ env.RELEASENAME }} -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/${{ env.RELEASENAME }} -n ${{ env.NAMESPACE }} --timeout=90s
          echo "Deployment verified successfully"

      - name: Cleanup kubeconfig
        if: always()
        run: |
          rm -f /tmp/kubeconfig
          echo "Kubeconfig cleaned up successfully"

